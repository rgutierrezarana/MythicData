x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    # Conexión al Data Warehouse PostgreSQL
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-airflow}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
    POSTGRES_DB: ${POSTGRES_DB:-airflow}
    POSTGRES_DB_MTG: ${POSTGRES_DB_MTG:-mtg_dw}
    # Conexión al Cluster Dedicado de Apache Spark
    SPARK_MASTER: ${SPARK_MASTER:-spark://spark-master:7077}
    DATA_DIR: /opt/airflow/data
    POSTGRES_JDBC_JAR: /opt/spark/jars/postgresql-42.7.3.jar
    # Trazabilidad Distribuida OpenTracing / OpenTelemetry & Jaeger
    ENABLE_TRACING: ${ENABLE_TRACING:-true}
    JAEGER_HOST: jaeger
    JAEGER_PORT: 6831
    JAEGER_UI_URL: ${JAEGER_UI_URL:-http://localhost:16686}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mtg-airflow-spark}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./backend:/opt/airflow/backend
    - ./frontend/dist:/opt/airflow/frontend/dist
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos PostgreSQL (Metadatos Airflow + MTG Data Warehouse mtg_dw)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mtg_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - ./sql/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # 2. Jaeger Tracing (OpenTracing / OpenTelemetry All-In-One UI & Collector)
  # ----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: mtg_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    ports:
      - "16686:16686"   # Jaeger Web UI (http://localhost:16686)
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "14268:14268"   # Jaeger HTTP collector
      - "6831:6831/udp" # Jaeger Compact Thrift Agent
    restart: always

  # ----------------------------------------------------------------------------
  # 3. Cluster Dedicado de Apache Spark: Master Node (Python 3.10)
  # ----------------------------------------------------------------------------
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: mtg-spark:3.5.1
    container_name: mtg_spark_master
    hostname: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PYSPARK_PYTHON=/usr/local/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python3
      - ENABLE_TRACING=${ENABLE_TRACING:-true}
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=6831
      - JAEGER_UI_URL=${JAEGER_UI_URL:-http://localhost:16686}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      - OTEL_SERVICE_NAME=mtg-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "7077:7077"   # Puerto RPC para jobs PySpark
      - "9090:8080"   # Web UI de Spark Master (http://localhost:9090)
    volumes:
      - ./data:/opt/airflow/data
      - ./spark_jobs:/opt/airflow/spark_jobs
    depends_on:
      - jaeger
    restart: always

  # ----------------------------------------------------------------------------
  # 4. Cluster Dedicado de Apache Spark: Worker Node (Python 3.10)
  # ----------------------------------------------------------------------------
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: mtg-spark:3.5.1
    container_name: mtg_spark_worker
    hostname: spark-worker
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PYSPARK_PYTHON=/usr/local/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python3
      - ENABLE_TRACING=${ENABLE_TRACING:-true}
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=6831
      - JAEGER_UI_URL=${JAEGER_UI_URL:-http://localhost:16686}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      - OTEL_SERVICE_NAME=mtg-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2G --webui-port 8081 spark://spark-master:7077
    ports:
      - "9091:8081"   # Web UI de Spark Worker (http://localhost:9091)
    volumes:
      - ./data:/opt/airflow/data
      - ./spark_jobs:/opt/airflow/spark_jobs
    depends_on:
      - spark-master
      - jaeger
    restart: always

  # ----------------------------------------------------------------------------
  # 5. Airflow DB Init & Creación de Usuario Administrador
  # ----------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: mtg_airflow_init
    command: >
      bash -c "airflow db migrate && airflow users create --role Admin --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname Admin --lastname User --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      jaeger:
        condition: service_started
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 6. Airflow Webserver (UI en http://localhost:8080)
  # ----------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: mtg_airflow_webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      jaeger:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ----------------------------------------------------------------------------
  # 7. Airflow Scheduler (Orquestador de Tareas)
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: mtg_airflow_scheduler
    command: airflow scheduler
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      jaeger:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ----------------------------------------------------------------------------
  # 8. MTG Explorer Web App (FastAPI + SolidJS SPA en http://localhost:8000)
  # ----------------------------------------------------------------------------
  web-app:
    <<: *airflow-common
    container_name: mtg_web_app
    entrypoint: []
    command: bash -c "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: always

volumes:
  postgres-db-volume:
